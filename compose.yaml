services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PCAP_DATA_DIR: /data
      PCAP_MAX_UPLOAD_BYTES: 104857600
    volumes:
      - pcap-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pcap-data:

