services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PCAP_DATA_DIR: /data
      PCAP_MAX_UPLOAD_BYTES: 104857600
    volumes:
      - pcap-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
      - validation-egress

  validator-image:
    profiles: ["build-only"]
    build:
      context: .
      dockerfile: Dockerfile.validator
    image: pcap-validator:local
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pcap-data:

networks:
  validation-egress:
    name: pcap-validation-egress
    internal: true
